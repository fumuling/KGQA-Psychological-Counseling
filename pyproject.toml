[tool.poetry]
name = "kgqa-psychological-counseling"
version = "0.1.0"
description = "Knowledge Graph QA System for Psychological Counseling"
authors = ["Your Name <your.email@example.com>"]
readme = "README.md"
packages = [{include = "QASystem"}, {include = "data"}]

[tool.poetry.dependencies]
python = "^3.8"
flask = "^2.3.0"
flask-cors = "^4.0.0"
py2neo = "^2021.2.3"
pyahocorasick = "^2.0.0"
tqdm = "^4.65.0"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.0"
pytest-cov = "^4.1.0"
pytest-mock = "^3.11.0"

# Note: Use 'poetry run pytest' instead of scripts for test commands

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "--cov=QASystem",
    "--cov=data",
    "--cov-report=term-missing",
    "--cov-report=html:htmlcov",
    "--cov-report=xml:coverage.xml",
    "--cov-fail-under=80",
    "-v"
]
markers = [
    "unit: Unit tests",
    "integration: Integration tests", 
    "slow: Slow running tests"
]

[tool.coverage.run]
source = ["QASystem", "data"]
omit = [
    "*/tests/*",
    "*/test_*.py",
    "*/venv/*",
    "*/__pycache__/*",
    "*/migrations/*",
    "*/build/*",
    "*/dist/*"
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "@abstract"
]
show_missing = true
skip_covered = false
fail_under = 80

[tool.coverage.html]
directory = "htmlcov"

[tool.coverage.xml]
output = "coverage.xml"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"